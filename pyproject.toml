[project]
name = "credit-risk-ifrs9"
version = "0.1.0"
description = "Credit scorecard, PD/LGD/EAD models and IFRS 9 expected credit loss on Lending Club loans, with a Power BI risk dashboard."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "numpy>=1.26",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
ml = [
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "xgboost>=2.1",
    "matplotlib>=3.9",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["credit_risk"]
